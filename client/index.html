<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── AUTH SCREEN ─────────────────────────── */
    #auth-screen {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
      text-align: center;
    }

    #auth-screen h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #58a6ff;
    }

    #auth-screen p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 28px;
    }

    .tab-buttons {
      display: flex;
      margin-bottom: 24px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #30363d;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #58a6ff;
      color: #0d1117;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #58a6ff; }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover { background: #2ea043; }

    #auth-message {
      margin-top: 14px;
      font-size: 0.85rem;
      min-height: 20px;
      color: #f85149;
    }

    #auth-message.success { color: #3fb950; }

    /* ── CHAT SCREEN ─────────────────────────── */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 700px;
      height: 90vh;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
    }

    #chat-header {
      padding: 16px 24px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chat-header h2 { font-size: 1rem; color: #58a6ff; }
    #chat-header span { font-size: 0.8rem; color: #8b949e; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background: #21262d;
      border-radius: 8px;
      padding: 10px 14px;
      max-width: 85%;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .message .sender {
      color: #58a6ff;
      font-weight: bold;
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .message.mine { align-self: flex-end; background: #1f3a2a; }
    .message.mine .sender { color: #3fb950; }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #30363d;
      background: #21262d;
    }

    #msg-input {
      flex: 1;
      margin-bottom: 0;
    }

    #send-btn {
      padding: 12px 20px;
      background: #58a6ff;
      border: none;
      border-radius: 8px;
      color: #0d1117;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ── AUTH SCREEN ── -->
  <div id="auth-screen">
    <h1>💬 Chat App</h1>
    <p>Sign in to start chatting</p>

    <div class="tab-buttons">
      <button class="tab-btn active" onclick="showTab('login')">Login</button>
      <button class="tab-btn" onclick="showTab('register')">Register</button>
    </div>

    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button class="submit-btn" onclick="handleAuth()">Continue →</button>

    <div id="auth-message"></div>
  </div>

  <!-- ── CHAT SCREEN ── -->
  <div id="chat-screen">
    <div id="chat-header">
      <h2>💬 Chat Room</h2>
      <span id="logged-in-label">Logged in as: —</span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Type a message..." />
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // ── STATE ──────────────────────────────────────
    let currentTab = "login";
    let currentUser = "";
    let socket = null;

    // ── TAB SWITCHING ──────────────────────────────
    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      setMessage("", false);
    }

    function setMessage(text, isError = true) {
      const el = document.getElementById("auth-message");
      el.textContent = text;
      el.className = isError ? "" : "success";
    }

    // ── AUTH HANDLER ───────────────────────────────
    async function handleAuth() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        setMessage("Please fill in both fields.");
        return;
      }

      const endpoint = currentTab === "login" ? "/login" : "/register";

      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (data.success) {
        currentUser = username;
        setMessage(data.message, false);
        setTimeout(() => enterChat(), 800);
      } else {
        setMessage(data.message);
      }
    }

    // ── ENTER CHAT ─────────────────────────────────
    function enterChat() {
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "flex";
      document.getElementById("logged-in-label").textContent = `Logged in as: ${currentUser}`;

      socket = new WebSocket("ws://localhost:8765");

      socket.onopen = () => {
        socket.send(currentUser);  // First message = identify yourself
      };

      socket.onmessage = (event) => {
        const [sender, ...rest] = event.data.split(": ");
        const text = rest.join(": ");
        addMessage(sender, text, sender === currentUser);
      };

      socket.onclose = () => addSystemMessage("Disconnected from server.");
    }

    // ── MESSAGE DISPLAY ────────────────────────────
    function addMessage(sender, text, isMine) {
      const div = document.createElement("div");
      div.className = "message" + (isMine ? " mine" : "");
      div.innerHTML = `<div class="sender">${sender}</div><div>${text}</div>`;
      document.getElementById("messages").appendChild(div);
      document.getElementById("messages").scrollTop = 9999;
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.style.cssText = "text-align:center;color:#8b949e;font-size:0.8rem;padding:6px";
      div.textContent = text;
      document.getElementById("messages").appendChild(div);
    }

    // ── SEND MESSAGE ───────────────────────────────
    function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !socket) return;
      socket.send(text);
      input.value = "";
    }

    // Enter key sends message
    document.getElementById("msg-input")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
